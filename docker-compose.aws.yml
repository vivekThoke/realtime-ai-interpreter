services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: realtime_interpreter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d realtime_interpreter",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Realtime AI Interpreter
      APP_VERSION: 0.1.0
      ENVIRONMENT: production

      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/realtime_interpreter
      REDIS_URL: redis://redis:6379/0

      STT_PROVIDER: gemini
      TRANSLATION_PROVIDER: gemini
      TTS_PROVIDER: gemini

      GEMINI_API_KEY: ${GEMINI_API_KEY}

      GEMINI_STT_MODEL: ${GEMINI_STT_MODEL}
      GEMINI_TRANSLATION_MODEL: ${GEMINI_TRANSLATION_MODEL}
      GEMINI_TTS_MODEL: ${GEMINI_TTS_MODEL}
      GEMINI_TTS_VOICE: ${GEMINI_TTS_VOICE}

    command:
      [
        "sh",
        "-c",
        "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
      ]

volumes:
  postgres_data:
  redis_data: